server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Product Service
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**

            # User Service
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

#              cart Sevice
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/cart/**

#               order service
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/