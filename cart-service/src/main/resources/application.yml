
  server:
    port: 8084

  spring:
    application:
      name: cart-service

    datasource:
      url: jdbc:mysql://db:3306/cart_db
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  eureka:
    client:
      register-with-eureka: true
      fetch-registry: true
      service-url:
        defaultZone: http://eureka-server:8761/eureka/

  management:
    endpoints:
      web:
        exposure:
          include: "*"
    
