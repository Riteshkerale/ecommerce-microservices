server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/user_service_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


  instance:
    hostname: localhost
    prefer-ip-address: true

jwt:
  secret: your-very-long-secret-key-change-this
  expiration: 86400000