server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://db:3306/user_service_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    hostname: user-service
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000