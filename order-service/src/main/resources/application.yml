spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/order_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  show-sql: true

  properties:
    hibernate:
      format_sql: true

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:

  retry:
    instances:
      productServiceRetry:
        max-attempts: 3
        wait-duration: 1s

  circuitbreaker:
    instances:
      productService:
        slidingWindowSize: 2
        minimumNumberOfCalls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

  timelimiter:
    instances:
      productServiceTimeLimiter:
        timeout-duration: 2s
        cancel-running-future: true